method: "BOLP"
full_name: "Biome-Orthogonal Linear Probing"
type: "representation_transformation"
use_biome_during_training: true
training_subset: "known_biome"
feature_layer: "final_encoder_layer"
hyperparameters:
  rank_k: "min(num_biomes - 1, feature_dimension)"
  skip_residualization: false
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
